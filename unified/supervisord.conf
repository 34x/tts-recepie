[supervisord]
user = root
logfile = /var/log/supervisord.log
pidfile = /var/run/supervisord.pid

[program:piper]
command = /app/.venv/bin/python /app/piper_tts.py
directory = /app
environment=HOST="0.0.0.0",PORT="8095"
autostart = true
autorestart = true
startretries = 5
startsecs = 2
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stdout
stderr_logfile_maxbytes = 0

[program:supertonic]
command = /app/.venv/bin/python /app/supertonic_tts.py
directory = /app
environment=HOST="0.0.0.0",PORT="8096"
autostart = true
autorestart = true
startretries = 5
startsecs = 2
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stdout
stderr_logfile_maxbytes = 0

; UI starts last; wait_health.py gates it until both backends answer /health
; then exec replaces the shell so signals reach the server directly.
[program:ui]
command = /bin/sh -c "/app/.venv/bin/python /app/wait_health.py && exec /app/.venv/bin/python -u /app/ui/server.py"
directory = /app/ui
environment=HOST="0.0.0.0",PORT="8099"
autostart = true
autorestart = true
startretries = 5
startsecs = 2
priority = 100
; Route UI to container stdout so `podman logs` / `start.py logs` work as before.
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stdout
stderr_logfile_maxbytes = 0
